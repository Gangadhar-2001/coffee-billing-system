services:
  - type: web
    name: coffee-billing-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: '1'
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_PATH
        value: /var/data/coffee.db
    disk:
      name: coffee-data
      mountPath: /var/data
      sizeGB: 1
