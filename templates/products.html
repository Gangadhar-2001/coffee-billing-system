{% extends 'base.html' %}{% block content %}<h1>Products & pricing</h1><section class="panel"><h2>Add or edit product</h2><form method="post" class="form-grid" id="product-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="id" id="pid"><label>Name<input name="name" id="pname" required maxlength="100"></label><label>Category<input name="category" id="pcategory" value="Coffee" required></label><label>Price (₹)<input name="price" id="pprice" type="number" min="0" step="0.01" required></label><button>Save product</button><button type="button" class="secondary" onclick="document.getElementById('product-form').reset();document.getElementById('pid').value=''">Clear</button></form></section><div class="panel overflow"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>{% for p in products %}<tr><td>{{ p.name }}</td><td>{{ p.category }}</td><td>₹{{ p.price_paise|money }}</td><td>{{ 'Active' if p.active else 'Hidden' }}</td><td><button class="small secondary" onclick="editProduct({{ p.id }},{{ p.name|tojson }},{{ p.category|tojson }},{{ (p.price_paise / 100)|tojson }})">Edit</button><form class="inline" method="post" action="{{ url_for('toggle_product',pid=p.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="small">{{ 'Hide' if p.active else 'Enable' }}</button></form></td></tr>{% endfor %}</tbody></table></div><script>function editProduct(id,name,category,price){document.getElementById('pid').value=id;document.getElementById('pname').value=name;document.getElementById('pcategory').value=category;document.getElementById('pprice').value=price;window.scrollTo(0,0)}</script>{% endblock %}
