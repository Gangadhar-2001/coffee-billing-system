{% extends 'base.html' %}{% block content %}<div class="heading"><h1>Sales history</h1><a class="button" href="/export.csv">Export CSV</a></div><form class="inline" method="get"><input name="q" value="{{ q }}" placeholder="Search customer or bill ID"><button>Search</button></form><div class="panel overflow"><table><thead><tr><th>Bill</th><th>Date</th><th>Customer</th><th>Payment</th><th>Total</th><th></th></tr></thead><tbody>{% for b in bills %}<tr><td>#{{ b.id }}</td><td>{{ b.created_at }}</td><td>{{ b.customer or 'Walk-in' }}</td><td>{{ b.payment_method }}</td><td>₹{{ b.total_paise|money }}</td><td><a href="{{ url_for('invoice',bill_id=b.id) }}">View</a></td></tr>{% else %}<tr><td colspan="6">No bills found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
